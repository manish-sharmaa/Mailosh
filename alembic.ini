[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# No `sqlalchemy.url` here, deliberately: migrations/env.py builds it from
# `Settings().database_url` at run time instead, so `MAILOSH_DATABASE_URL`
# / `.env` stays the one source of truth for where the app itself connects
# — never duplicated into (and risking drifting from) this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
